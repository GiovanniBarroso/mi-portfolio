<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Tema antes de la primera pintura. Sin esto el sitio aparece en claro
      durante unos milisegundos y luego salta a oscuro: el clásico flash.
      Va en línea y sin `defer` a propósito, se ejecuta antes del CSS.
      (La CSP del build lo permite por hash: si se cambia, se recalcula solo.)
    -->
    <script>
      ;(function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('theme')
          theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (e) {}
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>

    <!-- El color de la barra del navegador acompaña al tema activo -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- La fuente variable es el recurso crítico del primer render -->
    <link
      rel="preload"
      href="/fonts/inter/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta name="author" content="Giovanni Barroso" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Título, descripción, Open Graph y JSON-LD: los genera build/seo.ts
         por ruta a partir de src/config/seo.ts. No editar a mano. -->
    <!-- seo:start -->
    <title>Giovanni Barroso · Desarrollador Full-Stack</title>
    <!-- seo:end -->
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Este portfolio necesita JavaScript. Puedes escribirme a
        <a href="mailto:giovanni.baralv@gmail.com">giovanni.baralv@gmail.com</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
